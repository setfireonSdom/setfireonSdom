<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360"
     viewBox="0 0 1200 360" role="img" aria-label="边学边写 · 学到的整理成文章分享">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1115"/>
      <stop offset="0.6" stop-color="#141C22"/>
      <stop offset="1" stop-color="#293036"/>
    </linearGradient>
    <radialGradient id="glow" cx="830" cy="210" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#74808E"/>
      <stop offset="1" stop-color="#74808E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="seaG" x1="0" y1="252" x2="0" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2C353D" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2C353D" stop-opacity="0.7"/>
      <stop offset="0.72" stop-color="#191F24" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#191F24"/>
    </linearGradient>
    <linearGradient id="rule" x1="72" y1="0" x2="154" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C08A3C"/>
      <stop offset="1" stop-color="#C08A3C" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-25%" y="-80%" width="150%" height="260%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>
  <style>
  @keyframes fogA { from { transform: translateX(-30px) } to { transform: translateX(30px) } }
  @keyframes fogB { from { transform: translateX(26px) } to { transform: translateX(-26px) } }
  @keyframes sea  { from { transform: translateX(-40px) } to { transform: translateX(40px) } }
  @keyframes m1   { from { transform: translateX(-54px) } to { transform: translateX(54px) } }
  @keyframes m2   { from { transform: translateX(48px) } to { transform: translateX(-48px) } }
  @keyframes m3   { from { transform: translateX(-66px) } to { transform: translateX(66px) } }
  @keyframes far  { from { transform: translateX(-11px) } to { transform: translateX(11px) } }
  @keyframes breathe { 0%, 100% { opacity: .48 } 50% { opacity: .88 } }
  @keyframes twinkle { 0%, 100% { opacity: .12 } 50% { opacity: .95 } }
  @keyframes glide { from { transform: translateX(78px) } to { transform: translateX(-78px) } }
  @keyframes bob   { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-7px) } }

  .fogA, .fogB, .sea, .m1, .m2, .m3, .far { animation-timing-function: ease-in-out;
    animation-iteration-count: infinite; animation-direction: alternate; }
  .fogA { animation-name: fogA; animation-duration: 74s }
  .fogB { animation-name: fogB; animation-duration: 93s }
  .sea  { animation-name: sea;  animation-duration: 121s }
  .m1   { animation-name: m1;   animation-duration: 35s }
  .m2   { animation-name: m2;   animation-duration: 47s }
  .m3   { animation-name: m3;   animation-duration: 61s }
  .far  { animation-name: far;  animation-duration: 163s }
  .glow { animation-name: breathe; animation-duration: 13s;
          animation-timing-function: ease-in-out; animation-iteration-count: infinite }
  .star { animation-name: twinkle; animation-timing-function: ease-in-out;
          animation-iteration-count: infinite }
  .glide { animation-name: glide; animation-duration: 64s; animation-timing-function: ease-in-out;
           animation-iteration-count: infinite; animation-direction: alternate }
  .bob { animation-name: bob; animation-duration: 5.6s; animation-timing-function: ease-in-out;
         animation-iteration-count: infinite }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important }
  }
  </style>

  <rect width="1200" height="360" fill="url(#sky)"/>
