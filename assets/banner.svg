<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360"
     viewBox="0 0 1200 360" role="img" aria-label="边学边写 · 学到的整理成文章分享">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9FA9B3"/>
      <stop offset="0.6" stop-color="#C9C7BF"/>
      <stop offset="1" stop-color="#EFE6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="830" cy="210" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDF6E6"/>
      <stop offset="1" stop-color="#FDF6E6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="252" x2="0" y2="342" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6F0E2" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#F6F0E2" stop-opacity="0.7"/>
      <stop offset="0.72" stop-color="#EAE3D4" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#EAE3D4"/>
    </linearGradient>
    <linearGradient id="rule" x1="72" y1="0" x2="154" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9762E"/>
      <stop offset="1" stop-color="#A9762E" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-15%" y="-70%" width="130%" height="240%">
      <feGaussianBlur stdDeviation="11"/>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#sky)"/>
  <rect width="1200" height="360" fill="url(#glow)" opacity="0.55">
      <animate attributeName="opacity" values="0.55;0.8;0.55" dur="18s"
               repeatCount="indefinite"/></rect>

