  <ellipse cx="700" cy="320" rx="215" ry="10" fill="#FBF7EE" opacity="0.45" filter="url(#soft)"/>
  <ellipse cx="1046" cy="308" rx="160" ry="8" fill="#FBF7EE" opacity="0.4" filter="url(#soft)"/>
